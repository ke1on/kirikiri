<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <title>Xbox 手柄测试与震动</title>
</head>

<body>
        <h1>Xbox 手柄测试与震动</h1>
        <div id="status">等待手柄连接...</div>
        <div id="buttons"></div>
        <div id="axes"></div>
        <button id="vibrateButton">震动手柄</button>

        <script>
                // 检测手柄连接和断开
                window.addEventListener("gamepadconnected", (event) => {
                        const gamepad = event.gamepad;
                        document.getElementById("status").textContent = `手柄已连接: ${gamepad.id}`;
                });

                window.addEventListener("gamepaddisconnected", (event) => {
                        const gamepad = event.gamepad;
                        document.getElementById("status").textContent = `手柄已断开: ${gamepad.id}`;
                });

                // 更新手柄状态
                function updateGamepadStatus() {
                        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                        for (let gamepad of gamepads) {
                                if (gamepad) {
                                        // 更新按钮状态
                                        const buttonsDiv = document.getElementById("buttons");
                                        buttonsDiv.innerHTML = "按钮状态：<br>";
                                        for (let i = 0; i < gamepad.buttons.length; i++) {
                                                const button = gamepad.buttons[i];
                                                buttonsDiv.innerHTML += `按钮 ${i}: ${button.pressed ? "按下" : "释放"}<br>`;
                                        }

                                        // 更新摇杆状态
                                        const axesDiv = document.getElementById("axes");
                                        axesDiv.innerHTML = "摇杆状态：<br>";
                                        for (let i = 0; i < gamepad.axes.length; i++) {
                                                const axis = gamepad.axes[i];
                                                axesDiv.innerHTML += `轴 ${i}: ${axis.toFixed(2)}<br>`;
                                        }
                                }
                        }
                        requestAnimationFrame(updateGamepadStatus);
                }

                // 启动轮询
                requestAnimationFrame(updateGamepadStatus);

                // 震动手柄
                const fn = () => {
                        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                        for (let gamepad of gamepads) {
                                if (gamepad) {
                                        if (gamepad.vibrationActuator) {
                                                gamepad.vibrationActuator.playEffect("dual-rumble", {
                                                        startDelay: 0,
                                                        duration: 5000,
                                                        strongMagnitude: 1,
                                                        weakMagnitude: 0
                                                }).catch(console.error);
                                        } else {
                                                console.error("手柄不支持震动功能");
                                        }
                                }
                        }
                        setTimeout(() => {
                                fn();
                        }, 5050);
                }
                document.getElementById("vibrateButton").onclick = fn;
        </script>
</body>

</html>
